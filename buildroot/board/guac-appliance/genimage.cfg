# Disk-image layout for the appliance's OS disk (disk 1 of 2 — see
# README.md for why there's a second, separate data disk). Structure
# modeled on Buildroot's own board/pc/genimage-bios.cfg (verified against
# the real Buildroot source) — MBR boot sector + GRUB2 stage-1.5 + an ext4
# root partition. One deliberate difference from that reference: it names
# the root partition image "rootfs.ext2" because it uses the plain ext2
# variant; this defconfig selects BR2_TARGET_ROOTFS_EXT2_4 (ext4), and
# Buildroot's own fs/ext2/ext2.mk names its output
# rootfs.ext$(BR2_TARGET_ROOTFS_EXT2_GEN) — confirmed directly against
# that Makefile — so "rootfs.ext4" below is the correct filename for this
# configuration, not a copy-paste of the reference's ext2 name.
image disk.img {
	hdimage {
	}

	partition boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub.img"
		offset = 512
	}

	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
