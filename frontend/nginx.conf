# Serves the built SPA and proxies /api (including the WebSocket upgrade used
# by the Guacamole tunnel) to the backend container.
#
# NOTE: this listens on plain HTTP (8080) inside the container. Terminate TLS
# in front of this (a load balancer, or swap this for an nginx config with
# real certs) before exposing it externally — see docs/ARCHITECTURE.md.
server {
    listen 8080;
    server_name _;

    # Reported directly: uploads failed with a 413 for anything past a
    # certain size, despite the backend's own multer limit being a much
    # more generous 200MB (routes/sessions.ts's own paste-file route).
    # Confirmed directly, not assumed: nginx's own client_max_body_size
    # defaults to 1MB, and nothing here ever overrode it — every request
    # through this proxy, /api/ included, was hitting that ceiling
    # before the backend ever saw it at all, explaining exactly why
    # small files worked and larger ones didn't. Matches the backend's
    # own real limit rather than an arbitrary, separate number, so this
    # is never the lower of the two again.
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxied bookmarks — internal-only hosts the browser can't reach
    # directly but the backend container can. See routes/bookmarkProxy.ts.
    # Cookies must pass through untouched since auth here is a path-scoped
    # HttpOnly cookie, not a header nginx would otherwise forward for free.
    location /proxy/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /;
    }

    # The actual Guacamole WebSocket tunnel — real bug found live: this
    # was missing entirely. The frontend used to connect the tunnel to
    # bare `/`, which only ever hit the SPA static-file location below
    # (`try_files ... /index.html`) — there's no way to distinguish a
    # WebSocket upgrade from a normal page request on the exact same
    # path without nginx's notoriously fragile `if` directive, so nginx
    # just served index.html in response to what should have been a
    # WebSocket upgrade. The browser correctly reported this as an
    # immediate connection failure. Giving the tunnel its own dedicated
    # path here avoids that ambiguity entirely, matching the same
    # WebSocket-upgrade-aware proxy pattern already used for /api/ and
    # /proxy/ above — guacamole-lite's own WS server (backend's
    # guacTunnel.ts) isn't scoped to a specific path itself (confirmed by
    # reading its real source: `new WebSocketServer({ server: httpServer
    # })`, no `path` option), so it accepts connections regardless of
    # which path nginx forwards them from.
    location /tunnel {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
